<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#38bdf8" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Sky Glide" />
    <title>Sky Glide — 3D Aerial Arcade</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/icons/icon-192.svg" />
    <link rel="apple-touch-icon" href="/icons/icon-192.svg" />
  </head>
  <body>
    <div id="app">
      <canvas id="game-canvas" aria-label="Sky Glide 3D Canvas"></canvas>
      <div id="hud-layer" class="layer hidden"></div>
      <div id="touch-controls" class="layer hidden"></div>
      <div id="ui-overlays" class="layer"></div>
      <div id="rotate-overlay" class="rotate-overlay hidden" role="dialog" aria-modal="true">
        <div class="rotate-card">
          <div class="rotate-phone" aria-hidden="true">📱</div>
          <h2>Rotate to Landscape</h2>
          <p>Sky Glide plays best in wide cinematic landscape on phones and iPads!</p>
          <button id="dismiss-rotate-btn" class="btn btn-secondary" type="button">
            Play in Portrait Anyway
          </button>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
